[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-human-approved-signer"
version = "0.2.0"
description = "Human-approved, locally isolated Ed25519 signing for Technocore agent workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "congge918" },
]
dependencies = [
  "cryptography==50.0.0",
]

[project.urls]
Homepage = "https://github.com/congge918/technocore-human-approved-signer"
Repository = "https://github.com/congge918/technocore-human-approved-signer"
Issues = "https://github.com/congge918/technocore-human-approved-signer/issues"
Security = "https://github.com/congge918/technocore-human-approved-signer/security/advisories/new"

[project.scripts]
technocore-safe = "technocore_human_signer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
